version: "3.7"
services:
  db:
    image: mariadb:10.9.4
    restart: unless-stopped
    env_file: ./.env
    environment:
      - MARIADB_ROOT_PASSWORD=$DB_PASS
      - MYSQL_PASSWORD=$DB_PASS
    ports:
      - $DB_PORT:$DB_PORT
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d # Crea el usuario y la base vacía; el esquema lo aplica goose al arrancar el api
      - ./mysql:/var/lib/mysql # Mantener la misma data de mi base de datos local
    command: mysqld --sql-mode="" # Si no se pone esta opcion al al intentar cargar los property_id que son un UUID los toma con un numero+    
    healthcheck:
      test: ["CMD", 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MARIADB_ROOT_PASSWORD' ]
      timeout: 20s
      retries: 10

  api:
    depends_on:
      db:
        condition: service_healthy
    image: ghcr.io/thorque-software/leadsextractor-api:latest
    build:
      context: ./
      dockerfile: ./src/Dockerfile
    env_file: ./.env
    environment:
      - HOST=localhost
    ports:
      - $API_PORT:$API_PORT
    network_mode: "host"
    volumes:
      - ./src/actions.json:/go/app/src/actions.json
      # Token OAuth de Pipedrive: la app lo reescribe en cada refresh
      # (pkg/pipedrive/api.go). Sin este mount, el refresh se pierde en cada
      # deploy y hay que re-autorizar la app. El archivo debe existir en el
      # host antes del primer `docker compose up` (si no, Docker lo crea
      # como directorio y el mount falla).
      - ./src/${PIPEDRIVE_CLIENT_ID}.json:/go/app/src/${PIPEDRIVE_CLIENT_ID}.json

volumes:
  metabase_data:
