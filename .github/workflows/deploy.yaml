name: Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/lautarotetamusa/leadsextractor-api

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:10.9.4
        env:
          MARIADB_ROOT_PASSWORD: testpass123
          MYSQL_DATABASE: LeadsExtractor
          MYSQL_USER: teti
          MYSQL_PASSWORD: testpass123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
      # Igual que db/init/set_mode.sql: sin esto, insertar un string que es
      # un UUID falla porque MySQL lo interpreta como número.
      - name: Configurar sql_mode
        run: mysql -h127.0.0.1 -uroot -ptestpass123 -e "SET GLOBAL sql_mode='';"
      - name: go test (mockeados)
        working-directory: src
        run: go test $(go list ./... | grep -v /scripts)
      # Corre migraciones reales contra la DB descartable de este job y
      # ejercita el INSERT real de cada fuente — es lo único que detecta un
      # desajuste entre el código y el schema (ver
      # service/communication_integration_test.go y HEALTHCHECK.md).
      - name: go test (integración, DB real)
        working-directory: src
        env:
          HOST: 127.0.0.1
          DB_USER: teti
          DB_PASS: testpass123
          DB_PORT: 3306
          DB_NAME: LeadsExtractor
        run: go test -tags=integration ./service/...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # En PRs solo construye (valida el Dockerfile), no publica nada.
      - uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./src/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=leadsextractor-api
          cache-to: type=gha,mode=max,scope=leadsextractor-api

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    uses: Thorque-Software/actions/.github/workflows/rsync.yml@main
    secrets:
      key: ${{ secrets.SSH_PRIVATE_KEY }}
      env-file-content: ${{ secrets.ENV_FILE_CONTENT }}
    with:
      user: ubuntu
      host: ${{ vars.SERVER_HOST }}
      deploy-path: /home/ubuntu/LeadsExtractor
      # Ya no se sincroniza ./src: el código viaja en la imagen de GHCR.
      # Sincronizar solo el bootstrap de la DB, nginx y el compose evita que
      # queden archivos fantasma de versiones viejas en el servidor.
      files: "./db/init ./nginx docker-compose.yml"
      script: |
          docker compose pull

          docker compose up -d --remove-orphans

          docker image prune -f
